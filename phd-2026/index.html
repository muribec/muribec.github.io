const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT)));
  document.open(); document.write(html); document.close();
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim(), err = document.getElementById("err");
  err.textContent = "Abriendo…";
  const rem = document.getElementById("rem").checked;
  try { await unlock(pw); if (rem) try { localStorage.setItem("phd26:pw", pw); } catch(e){} }
